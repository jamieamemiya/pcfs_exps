/* Consent Form */

      </p>

/***********************
 * COUNTERFACTUAL RELEVANCE (Screen 4 - NEW)
 ***********************/
// Shown right after a candidate's data screen, before that candidate's post-evaluation.
// oppositeParty = the party of the candidate who did NOT actually serve in that data screen,
// i.e. the hypothetical winner in the "we should consider what would have happened..." prompt.
// imagePath = path to the figure that was just shown on the preceding data screen,
// so participants can reference it while answering.
function makeCounterfactualTrial(oppositeParty, dataKey, imagePath, candidateName, goodBad, outcomeLabel) {
  // Holds the participant's current slider value for this trial instance.
  // We can't rely on reading the DOM in on_finish, because by the time
  // on_finish runs, jsPsych has already cleared the display element's
  // HTML (it does this before calling finishTrial/on_finish), so the
  // slider element no longer exists. That was causing every response to
  // silently fall back to the default value of 5.
  var capturedSliderValue = null;

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: function () {
      return `
        <div style="width:1000px;">
            <img src="${imagePath}" width="auto" height="400">
            <p style="margin-top:20px;">Someone says: "Based on this data, it seems like ${candidateName} was pretty ${goodBad} for ${outcomeLabel}."</p>
            <p>A <u>second</u> person says: "Well, before saying ${candidateName} was ${goodBad}, we should consider what would have happened had the ${oppositeParty} candidate won."</p>
            <div style='margin-top: 20px;'>
                <label for="slider">How much do you agree with the <u>second</u> person? <span id="slider-value"></span></label>
                <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                    <span>0 = Not at all</span>
                    <input type="range" min="0" max="10" step="1" value="5" class="jspsych-slider" id="slider" style="width: 80%; height: 2em;">
                    <span>10 = Very much</span>
                </div>
            </div>
        </div>
      `;
    },
    choices: ['Continue'],
    button_html: '<button class="jspsych-btn" id="continue-btn" disabled>%choice%</button>',
    on_load: function () {
      var slider = document.getElementById('slider');
      var sliderValue = document.getElementById('slider-value');
      var continueBtn = document.getElementById('continue-btn');

      // Reset for this presentation of the trial, and initialize to the
      // slider's starting value in case a participant clicks Continue
      // without interacting with the slider at all (still reflects reality
      // rather than silently defaulting elsewhere).
      capturedSliderValue = slider ? Number(slider.value) : null;

      if (slider) {
        slider.oninput = function () {
          sliderValue.innerHTML = slider.value;
          continueBtn.disabled = false;
          capturedSliderValue = Number(slider.value);
        };
        slider.onclick = function () {
          sliderValue.innerHTML = slider.value;
          continueBtn.disabled = false;
          capturedSliderValue = Number(slider.value);
        };
      }
    },
    on_finish: function (data) {
      // NOTE: by the time on_finish runs, the plugin has already cleared the
      // display element, so document.getElementById('slider') returns null
      // here. We must rely on the value captured during on_load's event
      // listeners (above) instead of querying the DOM in on_finish.
      data['counterfactual_relevance_' + dataKey] = capturedSliderValue !== null ? capturedSliderValue : 5;
      console.log("Counterfactual relevance (" + dataKey + ") stored: ", data['counterfactual_relevance_' + dataKey]);
    }
  };
}
